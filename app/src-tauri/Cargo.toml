[package]
name = "hoa-accounting"
version = "0.1.0"
description = "HOA Accounting — association financial management"
authors = ["David A. Weilert"]
license = "Apache-2.0"
repository = "https://github.com/dweilert/hoa-accounting-tauri"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
