[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoa-accounting"
version = "0.1.0"
description = "Starter accounting engine for HOA bookkeeping"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI" }]
dependencies = [
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "flask>=3.0",
  "reportlab>=4.0",
  "boto3>=1.34"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hoa_accounting.migrations" = ["*.sql"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes — real lint, keep.
# I: import sorting — keep (auto-fixable via --fix).
# B: bugbear — surfaces real bug shapes (B905 zip without strict, B017 broad raises).
# UP: pyupgrade — modernise to current Python idioms.
select = ["E", "F", "I", "B", "UP"]
# E501 line-too-long: black already enforces line length where it can wrap.
# Anything still over 88 is an unwrappable string (SQL, error messages,
# encoded fixtures); not worth chasing.
# E402 module-level import not at top: allowed because some imports
# happen inside `create_app()` after config validation.
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"

